<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VocabApp | Вхід</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div style="max-width:1100px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:100%;">
    <a href="index.html" class="navbar-brand">Vocab<span>App</span></a>
    <ul style="list-style:none;display:flex;gap:4px;align-items:center;">
      <li><a class="nav-link" href="index.html">Про додаток</a></li>
      <li><a class="nav-link" href="register.html">Реєстрація</a></li>
      <li><a class="nav-link active" href="login.html">Вхід</a></li>
      <li><a class="nav-link" href="profile.html">Профіль</a></li>
      <li><a class="nav-link" href="study.html">Навчання</a></li>
    </ul>
  </div>
</nav>

<main style="position:relative;overflow:hidden;">
  <div class="hero-glow"></div>
  <div style="max-width:480px;margin:0 auto;padding:4rem 1.5rem;">

    <div style="text-align:center;margin-bottom:2.5rem;" class="fade-up">
      <div class="app-emblem" style="width:60px;height:60px;font-size:1.6rem;border-radius:16px;">🔑</div>
      <h2 style="font-size:1.8rem;margin-bottom:0.4rem;">З поверненням</h2>
      <p style="color:var(--text-muted);font-size:0.95rem;">Введіть дані для входу до акаунту</p>
    </div>

    <div class="form-card fade-up fade-up-1">
      <div id="login-alert" class="form-alert" style="display:none;"></div>

      <form id="login-form" novalidate>
        <div style="margin-bottom:1.2rem;">
          <label class="form-label" for="login-email">Email адреса</label>
          <input id="login-email" type="email" class="form-control" placeholder="you@example.com" style="width:100%;">
        </div>

        <div style="margin-bottom:0.5rem;">
          <label class="form-label" for="login-password">Пароль</label>
          <input id="login-password" type="password" class="form-control" placeholder="••••••••" style="width:100%;">
        </div>

        <div style="text-align:right;margin-bottom:1.8rem;">
          <a href="#" style="font-size:0.82rem;color:var(--primary);text-decoration:none;">Забули пароль?</a>
        </div>

        <button id="login-submit" type="submit" class="btn-primary-custom" style="width:100%;text-align:center;">
          Увійти →
        </button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.88rem;color:var(--text-muted);">
        Немає акаунту? <a href="register.html" style="color:var(--primary);text-decoration:none;">Зареєструватись</a>
      </p>
    </div>

  </div>
</main>

<footer>© 2026 <span>VocabApp</span> — усі права захищені</footer>

<script src="js/auth.model.js"></script>
<script src="js/login.controller.js"></script>
</body>
</html>
